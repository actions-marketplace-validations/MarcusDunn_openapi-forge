version: 2
updates:
  # GitHub Actions used in workflows under .github/workflows/.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns: ["*"]

  # Root cargo workspace (crates/* and xtask).
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # wasmtime and wasmtime-wasi are released in lockstep and must share a
      # major version; wit-bindgen and wit-bindgen-rt likewise. Each pair has
      # to arrive as a single PR to be mergeable — split in two, neither half
      # compiles on its own.
      #
      # Keep these groups patterns-only. They previously also carried
      # `update-types: [major, minor, patch]`, which enumerates every value and
      # so restricts nothing, but the group never actually fired: wasmtime and
      # wasmtime-wasi still arrived as separate PRs (#98, #99) months after the
      # group was added, and no "bump the wasmtime group" PR was ever opened.
      # The groups that do work here use exactly one of the two keys — the
      # `actions` group is patterns-only, `cargo-minor-patch` is
      # update-types-only — so combining them is the thing to avoid. Upstream
      # has open bugs on that interaction: dependabot-core#13919 (removing
      # `patterns` restored grouping) and #14202 (pattern-matched dependencies
      # are marked handled regardless of update-types).
      wasmtime:
        patterns: ["wasmtime*"]
      wit-bindgen:
        patterns: ["wit-bindgen*"]
      cargo-minor-patch:
        update-types: [minor, patch]

  # Plugins workspace — built as wasm32-wasip2 components.
  - package-ecosystem: cargo
    directory: /plugins
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  # Fuzz workspace — pinned to nightly (rust-toolchain.toml), libfuzzer deps.
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Keep wasmtime* together here too (transitive via the root crates) so a
      # major bump doesn't land as a standalone, uncompilable /fuzz PR.
      # Patterns-only, for the reason spelled out on the root cargo config
      # above.
      wasmtime:
        patterns: ["wasmtime*"]
      cargo-minor-patch:
        update-types: [minor, patch]

  # Go reference plugin (TinyGo + wit-bindgen-go).
  - package-ecosystem: gomod
    directory: /plugins/generator-go-server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      gomod-minor-patch:
        update-types: [minor, patch]
